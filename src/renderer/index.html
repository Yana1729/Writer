<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Code Exporter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Левая панель: дерево -->
    <aside class="sidebar">
      <h3>📂 Файлы проекта</h3>
      <div id="folderTree" class="tree"></div>
    </aside>

    <!-- Правая панель: управление -->
    <main class="main">
      <div class="controls">
        <button id="btnPickFolder">📁 Выбрать папку</button>
        <span id="projectPath"></span>
      </div>

      <div class="controls">
        <button id="btnScan">🔍 Сканировать</button>
        <button id="selectAll">✅ Выбрать все</button>
        <button id="clearSelection">❌ Очистить</button>
      </div>

      <div class="export">
        <label><input type="radio" name="format" value="docx" checked> DOCX</label>
        <label><input type="radio" name="format" value="html"> HTML</label>
        <button id="btnExport">💾 Экспорт</button>
      </div>

      <div id="status" class="status"></div>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
